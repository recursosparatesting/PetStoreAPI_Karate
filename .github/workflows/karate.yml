name: PetStore API - Karate - Allure
on:
  push:
    branches: [ main ]
  
  workflow_dispatch:
    inputs:
      tag_to_run:
        description: 'Etiqueta (Tag) de Karate a ejecutar'
        required: true
        default: '@crearMascota'
        type: string

jobs:
  test-automation:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'


      - name: 📥 Clonar y compilar la AUT
        run: |
          git clone 'https://github.com/swagger-api/swagger-petstore.git' aut_repo

      - name: 🚀 Ejecutar la AUT en segundo plano
        run: |
          # El 'mvn package jetty:run' inicia el servidor en segundo plano
          cd aut_repo
          nohup mvn package jetty:run &> aut.log &
          cd ..
          echo "La AUT se está iniciando en segundo plano. Esperando..."

      - name: ⏱️ Esperar a que la AUT esté disponible (Health Check)
        uses: nev7n/wait_for_response@v1
        with:
          # URL por defecto de la aplicación PetStore con Jetty
          url: http://localhost:8080/api/v3/openapi.json
          timeout: 180000
          interval: 5000
          responseCode: 200


      - name: 3. Ejecutar Pruebas de Karate
        run: |
          mvn test -Dkarate.options="--tags ${{ github.event.inputs.tag_to_run || '@crearMascota' }}" || true

      - name: 4. Generar Reporte Allure
        run: |
          # Instalación rápida de Allure CLI
          curl -o allure.tgz -L https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -zxvf allure.tgz
          sudo ln -s $(pwd)/allure-2.24.0/bin/allure /usr/bin/allure
          # Generación del reporte estático
          allure generate allure-results --clean -o allure-report

      - name: 5. Exportar Reporte Nativo de Karate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-html-report
          path: target/karate-reports/
          retention-days: 7

      - name: 6. Exportar Reporte de Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 90